tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Create a new contact with the provided information
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            description: The contact's full name
          email:
            type: string
            format: email
            description: The contact's email address
          phone:
            type: string
            description: The contact's phone number
          favorite:
            type: boolean
            description: Whether the contact should be marked as favorite
            default: false
        required:
          - name
          - email
          - phone
responses:
  '201':
    description: Contact created successfully
    content:
      application/json:
        schema:
          $ref: '../../../swagger/components/schemas/Contact.yaml'
  '400':
    description: Invalid input
    content:
      application/json:
        schema:
          $ref: '../../../swagger/components/schemas/Error.yaml'
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: '../../../swagger/components/schemas/Error.yaml' 