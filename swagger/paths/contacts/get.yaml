tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
description: Retrieve a list of contacts with optional filtering and pagination
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    required: false
    schema:
      type: integer
      minimum: 1
      default: 1
    description: Page number for pagination
  - name: limit
    in: query
    required: false
    schema:
      type: integer
      minimum: 1
      default: 20
    description: Number of items per page
  - name: favorite
    in: query
    required: false
    schema:
      type: boolean
    description: Filter contacts by favorite status
responses:
  '200':
    description: Successful response
    content:
      application/json:
        schema:
          type: object
          properties:
            contacts:
              type: array
              items:
                $ref: '../../../swagger/components/schemas/Contact.yaml'
            total:
              type: integer
              description: Total number of contacts
            page:
              type: integer
              description: Current page number
            limit:
              type: integer
              description: Number of items per page
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: '../../../swagger/components/schemas/Error.yaml' 