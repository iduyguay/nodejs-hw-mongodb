tags:
  - Contacts
summary: Delete a contact
operationId: deleteContact
description: Delete an existing contact
security:
  - bearerAuth: []
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
    description: Contact ID
responses:
  '200':
    description: Contact deleted successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              example: "Contact deleted"
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: '../../../../swagger/components/schemas/Error.yaml'
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          $ref: '../../../../swagger/components/schemas/Error.yaml' 