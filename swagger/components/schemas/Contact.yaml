type: object
properties:
  _id:
    type: string
    description: The contact's unique identifier
  name:
    type: string
    description: The contact's full name
  email:
    type: string
    format: email
    description: The contact's email address
  phone:
    type: string
    description: The contact's phone number
  favorite:
    type: boolean
    description: Whether the contact is marked as favorite
  owner:
    type: string
    description: The ID of the user who owns this contact
  createdAt:
    type: string
    format: date-time
    description: The date and time when the contact was created
  updatedAt:
    type: string
    format: date-time
    description: The date and time when the contact was last updated
required:
  - name
  - email
  - phone
  - owner 